name: Release

# A version tag builds a signed and notarized macOS release as a draft (docs/report.md §10).
# The annotated tag's message becomes the release notes, also shown by the in-app updater.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  macos:
    needs: checks
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: The tag matches the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The checkout leaves a lightweight copy of the tag; the notes are in the tag object.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # Subject and body only, so a signed tag's signature stays out.
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)')
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ] || [ -z "$notes" ]; then
            echo "::error::$GITHUB_REF_NAME needs to be an annotated tag with the release notes as its message"
            exit 1
          fi

      - run: npm ci

      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Tauri imports the certificate into a temporary keychain, signs, and notarizes and
      # staples the app.
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect the files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir release
          cp "$bundle/dmg/Tailgate_${VERSION}_aarch64.dmg" release/
          cp "$bundle/macos/Tailgate.app.tar.gz" "release/Tailgate_${VERSION}_aarch64.app.tar.gz"
          cp "$bundle/macos/Tailgate.app.tar.gz.sig" "release/Tailgate_${VERSION}_aarch64.app.tar.gz.sig"

      # Tauri signs the disk image but notarizes only the app inside it.
      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="release/Tailgate_${VERSION}_aarch64.dmg"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Check the signatures
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app=src-tauri/target/release/bundle/macos/Tailgate.app
          dmg="release/Tailgate_${VERSION}_aarch64.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes "$RUNNER_TEMP/notes.md" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "release/Tailgate_${VERSION}_aarch64.app.tar.gz.sig" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Tailgate_${VERSION}_aarch64.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > release/latest.json

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft --verify-tag --title "Tailgate $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # Built and kept as a workflow artifact only: Windows has not been tried on a real machine yet,
  # so it stays out of the public release (docs/report.md §10).
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailgate-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
