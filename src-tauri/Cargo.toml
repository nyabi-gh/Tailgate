[package]
name = "tailgate"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "tailgate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
gotatun = { version = "0.10.1", features = ["device"] }
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", features = ["form", "json", "query", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-dns", "socket-tcp", "socket-dns", "async", "socket-tcp-cubic", "log"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["signal", "test-util"] }
